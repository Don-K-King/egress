name: egress-local

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "", "--protected-mode", "yes"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data
    networks:
      - egress

  egress:
    image: livekit/egress:latest
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      EGRESS_CONFIG_FILE: /etc/egress/config.yaml
    volumes:
      - ./egress.config.yaml:/etc/egress/config.yaml:ro
      - ./output:/out
      # Optional hardening for Chrome sandboxing:
      # - ../../chrome-sandboxing-seccomp-profile.json:/seccomp/chrome-sandboxing-seccomp-profile.json:ro
    # security_opt:
    #   - seccomp=/seccomp/chrome-sandboxing-seccomp-profile.json
    networks:
      - egress

networks:
  egress:
    name: egress-local-net

volumes:
  redis-data:
